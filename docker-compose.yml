# Local Postgres for development. Plain Postgres — no Supabase, no extra services.
# The bond engine relies on gen_random_uuid(), which ships with Postgres 13+ (pgcrypto
# is created below anyway so older SQL that calls it still works).
# Pinned so the compose project name never follows the folder name. Without this,
# renaming the directory would make Compose look for a differently-prefixed volume,
# create an empty one, and the local database would appear wiped.
name: backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: endeleo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: endeleo
      POSTGRES_PASSWORD: endeleo
      POSTGRES_DB: endeleo
    ports:
      # 5434 on the host so it cannot collide with an existing local Postgres.
      - "5434:5432"
    volumes:
      - endeleo_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endeleo -d endeleo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  endeleo_pgdata:
